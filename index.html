<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recorrido de Recepción de Oficinas – Grupo Roble (Copy)</title>
<style>
:root{
  --verde:#2E5E3E; --verde2:#3F7A52; --verdeclaro:#E8EFE6;
  --bg:#F4F5F1; --card:#FFFFFF; --tx:#1D2420; --mut:#66706A; --line:#E1E4DE;
  --si:#2F8A4B; --si-bg:#E3F3E7; --no:#C0392B; --no-bg:#FBE6E3; --na:#6B7280; --na-bg:#ECEDEF;
  --A:#C0392B; --A-bg:#FBE6E3; --B:#C96A12; --B-bg:#FCEEDC; --C:#9A7B00; --C-bg:#FBF3D0; --D:#2563A8; --D-bg:#E2ECF8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--verde);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;display:flex;align-items:center;gap:10px;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.top h1{font-size:17px;margin:0;font-weight:650;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .sub{font-size:12px;opacity:.85;font-weight:400;display:block}
.iconbtn{background:none;border:0;color:#fff;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex:none}
.iconbtn:active{background:rgba(255,255,255,.15)}
.sync{font-size:11px;background:rgba(255,255,255,.18);padding:4px 8px;border-radius:99px;white-space:nowrap;flex:none}
main{padding:12px 12px calc(90px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;padding:8px 2px 9px;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button svg{width:22px;height:22px}
.nav button.on{color:var(--verde);font-weight:650}
.nav .badge{position:absolute;top:3px;left:calc(50% + 6px);background:var(--no);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;min-width:16px;line-height:16px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,.05);border:1px solid var(--line)}
.muted{color:var(--mut)}
.small{font-size:13px}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;background:var(--verde);color:#fff;min-height:46px}
.btn.sec{background:var(--verdeclaro);color:var(--verde)}
.btn.ghost{background:none;color:var(--verde);border:1px solid var(--line)}
.btn.danger{background:var(--no-bg);color:var(--no)}
.btn.full{width:100%}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1}
h2{font-size:15px;margin:18px 4px 8px;color:var(--verde);text-transform:uppercase;letter-spacing:.04em}
label.f{display:block;margin-bottom:12px}
label.f span{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid #CDD3CB;border-radius:10px;padding:11px 12px;background:#fff;min-height:46px}
textarea{min-height:70px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--verde2);outline-offset:0;border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:8px 13px;font-size:14px;white-space:nowrap}
.chip.on{background:var(--verde);border-color:var(--verde);color:#fff}
/* recorridos list */
.rec{display:block;width:100%;text-align:left;border:1px solid var(--line)}
.rec .t{font-weight:650}
.bar{height:7px;border-radius:9px;background:#E6E9E3;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--verde2)}
.pill{display:inline-block;font-size:12px;font-weight:650;border-radius:99px;padding:2px 9px}
.pA{background:var(--A-bg);color:var(--A)} .pB{background:var(--B-bg);color:var(--B)} .pC{background:var(--C-bg);color:var(--C)} .pD{background:var(--D-bg);color:var(--D)}
.pSi{background:var(--si-bg);color:var(--si)} .pNo{background:var(--no-bg);color:var(--no)} .pNA{background:var(--na-bg);color:var(--na)}
/* sections */
.sec{margin-bottom:12px}
.sech{width:100%;display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;text-align:left}
.sech .n{width:30px;height:30px;border-radius:9px;background:var(--verdeclaro);color:var(--verde);display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.sech .tt{flex:1;font-weight:650;font-size:15px}
.sech .cnt{font-size:13px;color:var(--mut);white-space:nowrap}
.sech .cnt.done{color:var(--si);font-weight:650}
.sech .chev{transition:transform .15s;color:var(--mut)}
.sec.open .sech{border-bottom-left-radius:0;border-bottom-right-radius:0}
.sec.open .chev{transform:rotate(90deg)}
.secb{display:none;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--r) var(--r);background:#FAFBF8;padding:8px}
.sec.open .secb{display:block}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;border-left:5px solid #D5DAD2}
.item.Si{border-left-color:var(--si)} .item.No{border-left-color:var(--no)} .item.NA{border-left-color:var(--na)}
.item .el{font-weight:650}
.item .num{color:var(--mut);font-weight:600;font-size:13px;margin-right:4px}
.item .cr{margin:4px 0 2px}
.item .me{font-size:13px;color:var(--mut)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.tri button{border:1.5px solid var(--line);background:#fff;border-radius:10px;min-height:46px;font-weight:650}
.tri .Si.on{background:var(--si);border-color:var(--si);color:#fff}
.tri .No.on{background:var(--no);border-color:var(--no);color:#fff}
.tri .NA.on{background:var(--na);border-color:var(--na);color:#fff}
.det{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.cats button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:7px 2px;font-size:12px;line-height:1.15;min-height:46px}
.cats button b{display:block;font-size:16px}
.cats .A.on{background:var(--A);border-color:var(--A);color:#fff}
.cats .B.on{background:var(--B);border-color:var(--B);color:#fff}
.cats .C.on{background:#C9A100;border-color:#C9A100;color:#fff}
.cats .D.on{background:var(--D);border-color:var(--D);color:#fff}
.lbl{font-size:12px;color:var(--mut);margin:0 0 4px}
.fotos{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.fotos .ph{width:68px;height:68px;border-radius:9px;overflow:hidden;position:relative;background:#eee;border:0;padding:0}
.fotos .ph img{width:100%;height:100%;object-fit:cover;display:block}
.addph{width:68px;height:68px;border-radius:9px;border:1.5px dashed #B9C2B6;background:#fff;color:var(--verde);display:grid;place-items:center;font-size:11px;text-align:center;position:relative;overflow:hidden}
.addph input{position:absolute;inset:0;opacity:0}
.notebtn{background:none;border:0;color:var(--verde);font-size:13px;padding:8px 0 0;font-weight:600}
/* stats */
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-size:26px;line-height:1.1}
.stat span{font-size:13px;color:var(--mut)}
.verdict{border-radius:var(--r);padding:14px;font-weight:650;margin-bottom:10px}
.v-ok{background:var(--si-bg);color:#1F6B37}
.v-no{background:var(--no-bg);color:#9E2B1F}
.v-wait{background:#FFF5D6;color:#7A5A00}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--mut);font-weight:600}
table.t td.r,table.t th.r{text-align:right;white-space:nowrap}
.hito{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.hito:last-child{border-bottom:0}
.hito .d{min-width:94px;text-align:right;font-weight:650;white-space:nowrap}
.hito .d.late{color:var(--no)} .hito .d.soon{color:var(--B)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1D2420;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;z-index:60;max-width:90vw;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 12px;font-size:18px}
.viewer{position:fixed;inset:0;background:#000;z-index:70;display:flex;align-items:center;justify-content:center}
.viewer img{max-width:100%;max-height:100%}
.viewer .bar2{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top)) 10px 10px;background:linear-gradient(rgba(0,0,0,.6),transparent)}
.viewer button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:600}
.empty{text-align:center;padding:40px 20px;color:var(--mut)}
.note{font-size:13px;background:var(--verdeclaro);color:#2C4A35;border-radius:10px;padding:10px 12px;margin-bottom:10px}
.estado{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin:8px 0}
.estado button{border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 4px;font-size:13px;min-height:42px;font-weight:600}
.estado button.on{background:var(--verde);border-color:var(--verde);color:#fff}
.done-line{opacity:.65}
</style>
</head>

tal"], ["14.02", "Llaves, tarjetas y controles", "Entregados con inventario firmado.", "Conteo y firma del inventario"]]}];

/* ---------- fechas y días hábiles (Costa Rica) ---------- */
function pd(s){if(!s)return null;const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function fd(d){return d?`${String(d.getDate()).padStart(2,"0")}/${String(d.getMonth()+1).padStart(2,"0")}/${d.getFullYear()}`:"";}
function iso(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function easter(y){const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;return new Date(y,mo-1,da);}
const _hol={};
function holidays(y){
  if(_hol[y])return _hol[y];
  const s=new Set(["01-01","04-11","05-01","07-25","08-02","08-15","08-31","09-15","12-01","12-25"].map(md=>`${y}-${md}`));
  const e=easter(y); s.add(iso(addDays(e,-3))); s.add(iso(addDays(e,-2)));
  return _hol[y]=s;
}
function isWork(d,useHol){const w=d.getDay();if(w===0||w===6)return false;return !(useHol&&holidays(d.getFullYear()).has(iso(d)));}
function workday(d,n,useHol){let x=new Date(d),k=0;while(k<n){x=addDays(x,1);if(isWork(x,useHol))k++;}return x;}
function addMonths(d,n){const x=new Date(d);x.setMonth(x.getMonth()+n);return x;}
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());};

/* ---------- estado y almacenamiento ---------- */
const S = {db:null,assets:null,user:null,downloads:null,uid:null,recs:{},pending:new Set(),cur:null,view:"matriz",filter:"todos",open:{},expanded:{},status:"local",readOnly:false,names:{}};
function lsGet(k,def){try{const v=localStorage.getItem(k);return v?JSON.parse(v):def;}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
S.recs = lsGet("grRec_cache",{});
S.pending = new Set(lsGet("grRec_pending",[]));
function persistLocal(){lsSet("grRec_cache",S.recs);lsSet("grRec_pending",[...S.pending]);}

function setStatus(st){S.status=st;const el=$("#sync");if(el)el.textContent=statusText();}
function statusText(){return {local:"En este teléfono",saving:"Guardando…",saved:"Guardado",offline:"Sin conexión · guardado local",ro:"Solo lectura",loading:"Conectando…"}[S.status]||"";}

function touch(rec){rec.actualizado=Date.now();S.recs[rec.id]=rec;S.pending.add(rec.id);persistLocal();scheduleFlush();}
let flushT=null,flushing=false,flushAgain=false;
function scheduleFlush(ms=900){clearTimeout(flushT);flushT=setTimeout(flush,ms);}
async function flush(){
  if(!S.db){setStatus("local");return;}
  if(S.readOnly){setStatus("ro");return;}
  if(flushing){flushAgain=true;return;}
  flushing=true;setStatus("saving");
  try{
    for(const id of [...S.pending]){
      const rec=S.recs[id];
      if(!rec){S.pending.delete(id);continue;}
      const sent=rec.actualizado;
      await S.db.doc("recorridos/"+id).set(clone(rec));
      if(S.recs[id]&&S.recs[id].actualizado===sent)S.pending.delete(id);
    }
    persistLocal();setStatus(S.pending.size?"saving":"saved");
  }catch(e){
    const c=e&&e.code;
    if(c==="invalid_argument"){S.readOnly=true;setStatus("ro");toast("No tiene permiso para guardar cambios en línea. Pida acceso de Colaborador.",4000);}
    else if(c==="quota_exceeded"){setStatus("offline");toast("Se llenó el almacenamiento en línea. Elimine recorridos antiguos.",4000);}
    else{setStatus("offline");clearTimeout(flushT);flushT=setTimeout(flush,15000);}
  }
  flushing=false;
  if(flushAgain){flushAgain=false;scheduleFlush(300);}
}
window.addEventListener("online",()=>scheduleFlush(200));

/* ---------- cálculos ---------- */
function stats(rec){
  const r={total:ALL.length,si:0,no:0,na:0,pend:0,cat:{A:0,B:0,C:0,D:0},sinCat:0};
  ALL.forEach(x=>{const it=rec.items[x.id]||{};if(it.c==="Si")r.si++;else if(it.c==="No"){r.no++;if(it.cat)r.cat[it.cat]++;else r.sinCat++;}else if(it.c==="NA")r.na++;});
  (rec.extras||[]).forEach(e=>{if(e.cat)r.cat[e.cat]++;else r.sinCat++;});
  r.eval=r.si+r.no+r.na;r.pend=r.total-r.eval;r.pct=r.si+r.no?Math.round(100*r.si/(r.si+r.no)):null;
  r.punch=r.no+(rec.extras||[]).length;
  r.abiertos=punchList(rec).filter(p=>p.estado!=="Aceptado").length;
  return r;
}
function verdict(rec,st){
  if(st.pend>0)return ["v-wait",`Recorrido incompleto: faltan ${st.pend} ítems por evaluar.`];
  if(st.cat.A>0)return ["v-no",`NO se puede firmar el Acta de Recepción Provisional: hay ${st.cat.A} pendiente(s) Categoría A (§6.5 y §9).`];
  if(st.sinCat>0)return ["v-wait",`Asigne categoría a ${st.sinCat} pendiente(s) antes de firmar.`];
  return ["v-ok",`SÍ procede firmar el Acta de Recepción Provisional, con el punchlist de ${st.punch} pendiente(s).`];
}
function punchList(rec){
  const out=[];
  ALL.forEach(x=>{const it=rec.items[x.id];if(it&&it.c==="No")out.push({key:x.id,ref:x.id,el:x.el,sec:x.secT,cat:it.cat||"",ubic:it.ubic||"",obs:it.obs||"",fotos:it.fotos||[],estado:it.estado||"Abierto",ronda:it.ronda||"",resp:it.resp||"",fcierre:it.fcierre||"",src:it});});
  (rec.extras||[]).forEach(e=>out.push({key:"x:"+e.id,ref:"Adicional",el:e.desc||"(sin descripción)",sec:"Pendiente adicional",cat:e.cat||"",ubic:e.ubic||"",obs:e.obs||"",fotos:e.fotos||[],estado:e.estado||"Abierto",ronda:e.ronda||"",resp:e.resp||"",fcierre:e.fcierre||"",src:e,extra:true}));
  const ord={A:0,B:1,C:2,D:3,"":4};
  return out.sort((a,b)=>(ord[a.cat]-ord[b.cat])||(a.estado==="Aceptado")-(b.estado==="Aceptado"));
}
function plazoCat(rec,c){const v=Number(rec["plazo"+c]);return v>0?Math.min(30,v):30;}
function dueDate(rec,cat){
  if(!cat)return "";
  if(cat==="D")return "Según plan";
  const a=pd(rec.fechaActa);if(!a)return "Falta fecha del acta";
  return fd(addDays(a,plazoCat(rec,cat)));
}
function hitos(rec){
  const H=rec.feriados!==false, av=pd(rec.fechaAviso), re=pd(rec.fecha), ac=pd(rec.fechaActa);
  const L=[
    ["Recorrido de recepción","3 días hábiles desde el aviso",av&&workday(av,3,H),"§6.2"],
    ["Acuerdo de categoría en discrepancia","2 días hábiles desde el recorrido",re&&workday(re,2,H),"§6.4"],
    ["No conformidad escrita del Cliente (si no recibe)","2 días hábiles desde el recorrido",re&&workday(re,2,H),"§9"],
    ["Plan de ejecución (calendario de corrección)","2 días hábiles desde el acta",ac&&workday(ac,2,H),"§6.6"],
    ["OC y fecha de llegada – Categoría D","3 días hábiles desde el acta",ac&&workday(ac,3,H),"§7"],
    ["Capacitación al personal del Cliente","15 días hábiles desde el acta",ac&&workday(ac,15,H),"§5"],
    ["Planos as-built (PDF y editable)","30 días hábiles desde el acta",ac&&workday(ac,30,H),"§5"],
    ["Manuales de O&M y garantías","30 días hábiles desde el acta",ac&&workday(ac,30,H),"§5"],
    ["Cierre total del punchlist (excepto D)","30 días calendario desde el acta",ac&&addDays(ac,30),"§7"],
    ["Vencimiento de la garantía de calidad","12 meses desde el acta",ac&&addMonths(ac,12),"§10"]];
  return L;
}

async function compress(file){
  try{
    const bmp=await createImageBitmap(file);const max=1600;const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b||file),"image/jpeg",0.8));
  }catch(e){return file;}
}

}

function wrapText(s,width,size,bold){

      if(line)out.push(line);

const hex2rgb=h=>{h=h.replace("#","");return [0,2,4].map(i=>(parseInt(h.substr(i,2),16)/255).toFixed(3)).join(" ");};

class MiniPDF{
  constructor(){this.W=595.28;this.H=841.89;this.pages=[];this.images=[];this.page=null;}
  addPage(){this.page={c:[],imgs:new Set()};this.pages.push(this.page);return this.page;}
  _y(y){return (this.H-y).toFixed(2);}
  text(x,y,s,o={}){const size=o.size||9,bold=!!o.bold;let xx=x;
    if(o.align==="right")xx=x-tw(s,size,bold);else if(o.align==="center")xx=x-tw(s,size,bold)/2;
    this.page.c.push(`BT /${bold?"F2":"F1"} ${size} Tf ${hex2rgb(o.color||"#1D2420")} rg ${xx.toFixed(2)} ${this._y(y)} Td ${pdfStr(s)} Tj ET`);}
  rect(x,y,w,h,o={}){let s="";if(o.fill)s+=`${hex2rgb(o.fill)} rg `;if(o.stroke)s+=`${hex2rgb(o.stroke)} RG ${(o.lw||0.5)} w `;
    s+=`${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} ${w.toFixed(2)} ${h.toFixed(2)} re `+(o.fill&&o.stroke?"B":o.fill?"f":"S");this.page.c.push(s);}
  line(x1,y1,x2,y2,o={}){this.page.c.push(`${hex2rgb(o.color||"#C9CFC6")} RG ${o.lw||0.5} w ${x1.toFixed(2)} ${this._y(y1)} m ${x2.toFixed(2)} ${this._y(y2)} l S`);}
  addJpeg(bytes,w,h){const name="Im"+(this.images.length+1);this.images.push({name,bytes,w,h});return name;}
  image(name,x,y,w,h){this.page.imgs.add(name);this.page.c.push(`q ${w.toFixed(2)} 0 0 ${h.toFixed(2)} ${x.toFixed(2)} ${(this.H-y-h).toFixed(2)} cm /${name} Do Q`);}
  output(){
    const enc=new TextEncoder();const parts=[];let len=0;const offs=[];
    const push=d=>{const b=typeof d==="string"?enc.encode(d):d;parts.push(b);len+=b.length;};
    const objs=[];const add=fn=>{objs.push(fn);return objs.length;};
    // 1 catalog, 2 pages, 3 F1, 4 F2, then images, then pages
    const nImg=this.images.length;const imgBase=5;const pageBase=imgBase+nImg;
    const pageIds=this.pages.map((p,i)=>pageBase+i*2);
    push("%PDF-1.4\n%\xE2\xE3\xCF\xD3\n");
    const obj=(id,body)=>{offs[id]=len;push(`${id} 0 obj\n`);if(typeof body==="string")push(body);else body.forEach(push);push("\nendobj\n");};
    obj(1,"<< /Type /Catalog /Pages 2 0 R >>");
    obj(2,`<< /Type /Pages /Kids [${pageIds.map(i=>i+" 0 R").join(" ")}] /Count ${this.pages.length} >>`);
    obj(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
    obj(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
    this.images.forEach((im,i)=>obj(imgBase+i,[`<< /Type /XObject /Subtype /Image /Width ${im.w} /Height ${im.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${im.bytes.length} >>\nstream\n`,im.bytes,"\nendstream"]));
    const imgId=Object.fromEntries(this.images.map((im,i)=>[im.name,imgBase+i]));
    this.pages.forEach((p,i)=>{
      const pid=pageIds[i],cid=pid+1;const content=p.c.join("\n");
      const xo=[...p.imgs].map(n=>`/${n} ${imgId[n]} 0 R`).join(" ");
      obj(pid,`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${this.W} ${this.H}] /Resources << /Font << /F1 3 0 R /F2 4 0 R >>${xo?` /XObject << ${xo} >>`:""} >> /Contents ${cid} 0 R >>`);
      obj(cid,[`<< /Length ${enc.encode(content).length} >>\nstream\n`,content,"\nendstream"]);
    });
    const n=pageBase+this.pages.length*2;const xref=len;
    let x=`xref\n0 ${n}\n0000000000 65535 f \n`;for(let i=1;i<n;i++)x+=String(offs[i]).padStart(10,"0")+" 00000 n \n";
    push(x+`trailer\n<< /Size ${n} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    const out=new Uint8Array(len);let o=0;parts.forEach(b=>{out.set(b,o);o+=b.length;});return out;
  }
}

  const resp=await fetch("/_blob/"+encodeURIComponent(id));if(!resp.ok)throw new Error("foto");
  const bmp=await createImageBitmap(await resp.blob());const k=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(bmp.width*k));c.height=Math.max(1,Math.round(bmp.height*k));
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",0.72));
  return {bytes:new Uint8Array(await blob.arrayBuffer()),w:c.width,h:c.height};
}

async function buildReport(r,opts={}){
  const P=new MiniPDF();const M=36,CW=P.W-2*M,BOT=P.H-46;let y=0;

  const h2=t=>{need(40);y+=8;P.text(M,y+10,t.toUpperCase(),{size:10.5,bold:true,color:VERDE});y+=16;P.line(M,y,M+CW,y,{color:VERDE,lw:1});y+=8;};

  // datos generales
  const D=[["Proyecto",r.proyecto],["Código",r.codigo],["Cliente",r.cliente],["Contrato N.º",r.contrato],["Inmueble, piso y local",r.inmueble],["Área contratada (m²)",r.area],

  const colW=CW/2;

    const cells=[D[i],D[i+1]].map(d=>d?wrapText(d[1]||"—",colW-130,9):[]);const rh=Math.max(...cells.map(c=>c.length))*12+8;
    [D[i],D[i+1]].forEach((d,j)=>{if(!d)return;const x=M+j*colW;P.rect(x,y,colW,rh,{fill:j%2?"#FFFFFF":"#FFFFFF",stroke:LINE});P.rect(x,y,122,rh,{fill:"#E8EFE6",stroke:LINE});

      x+=cols[3][1];o.forEach((l,k)=>P.text(x+4,y+11+k*10,l,{size:8}));
      y+=rh;});
    y+=6;});

  // punchlist
  const L=punchList(r);
  h2(`Punchlist (${L.length} pendiente${L.length===1?"":"s"})`);
  if(!L.length)para("Sin pendientes registrados.",{color:MUT});
  else{
    const pc=[["#",20],["Ref.",42],["Descripción / ubicación",200],["Cat.",30],["Fecha límite",62],["Estado",82],["Responsable",CW-20-42-200-30-62-82]];
    const ph=()=>{P.rect(M,y,CW,16,{fill:"#E8EFE6"});let x=M;pc.forEach(([t,w])=>{P.text(x+4,y+11,t,{size:8,bold:true,color:"#2C4A35"});x+=w;});y+=16;};
    ph();
    L.forEach((p,i)=>{
      const d=wrapText(p.el,pc[2][1]-8,8.5,true),u=wrapText([p.ubic,p.obs].filter(Boolean).join(" – "),pc[2][1]-8,8);
      const e=wrapText(p.estado+(p.ronda?" ("+p.ronda+")":""),pc[5][1]-8,8),rs=wrapText(p.resp||"",pc[6][1]-8,8);

      if(p.cat){P.rect(x+5,y+3,pc[3][1]-10,13,{fill:CATC[p.cat][1]});P.text(x+pc[3][1]/2,y+12.5,p.cat,{size:8.5,bold:true,color:CATC[p.cat][0],align:"center"});}
      x+=pc[3][1];P.text(x+4,y+11,dueDate(r,p.cat),{size:8});x+=pc[4][1];

  const sig=[["Gerente de Proyecto – Grupo Roble",r.gp],["Inspección – Grupo Roble",r.insp],["Representante del Cliente",r.repCliente]];

    P.text(P.W-M,P.H-18,`Página ${i+1} de ${N}`,{size:7.5,color:MUT,align:"right"});});
  return P.output();
}
async function exportPDF(r){
  if(S._pdfBusy)return;S._pdfBusy=true;
  const btn=document.querySelector("[data-act=pdf]");const old=btn&&btn.textContent;
  try{
    if(btn){btn.disabled=true;btn.textContent="Generando reporte…";}
    const bytes=await buildReport(r,{onProgress:(i,n)=>{if(btn)btn.textContent=`Agregando fotos ${i}/${n}…`;}});
    const name=`Reporte_Recorrido_${(r.codigo||r.proyecto||"proyecto").replace(/[^\w\-]+/g,"_")}_${r.fecha||""}.pdf`;
    if(!S.downloads){toast("La descarga no está disponible en esta vista. Abra la app en claude.ai.",4000);return;}
    await S.downloads.save({filename:name,data:new Blob([bytes],{type:"application/pdf"})});
    toast("Reporte PDF listo");
  }catch(e){if(!(e&&e.code==="declined"))toast("No se pudo generar el PDF.",3500);}
  finally{S._pdfBusy=false;if(btn){btn.disabled=false;btn.textContent=old;}}
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const t=e.target;
  if((t.classList&&t.classList.contains("modal"))||t.closest("button[data-close]")){closeLayer();return;}
  const b=t.closest("button,[data-open]");if(!b)return;
  const d=b.dataset;const r=cur();
  if(d.act==="home")return goHome();
  if(d.act==="new")return newRecDialog();
  if(d.open)return openRec(d.open);
  if(d.view)return setView(d.view);
  if(d.filter){S.filter=d.filter;return render();}
  if(d.sec){S.open[d.sec]=!(S.open[d.sec]??(S.filter!=="todos"));document.getElementById("sec-"+d.sec).classList.toggle("open");return;}
  if(d.mark){if(S.readOnly)return toast("Solo lectura");const it=itemState(r,d.id);it.c=it.c===d.mark?"":d.mark;if(it.c!=="No"){delete it.cat;}if(!it.c)delete it.c;touch(r);refreshItem(d.id);return;}
  if(d.cat){const it=itemState(r,d.id);it.cat=it.cat===d.cat?"":d.cat;touch(r);refreshItem(d.id);return;}
  if(d.note){S.expanded[d.note]=true;refreshItem(d.note);return;}
  if(d.photo)return viewPhoto(d.photo,d.owner,d.idx);
  if(d.estado){const s=pSrc(r,d.pk);if(!s)return;s.estado=d.estado;if(d.estado==="Aceptado"&&!s.fcierre)s.fcierre=iso(today());touch(r);render();return;}
  if(d.delx)return confirmDialog("¿Eliminar este pendiente adicional?","Eliminar",()=>{r.extras=r.extras.filter(x=>"x:"+x.id!==d.delx);touch(r);render();});
  if(d.act==="addx")return addExtraDialog();
  if(d.act==="delrec")return confirmDialog("¿Eliminar este recorrido para todo el equipo? No se puede deshacer.","Eliminar",async()=>{
    const id=r.id;delete S.recs[id];S.pending.delete(id);persistLocal();goHome();
    if(S.db){try{await S.db.doc("recorridos/"+id).delete();toast("Recorrido eliminado");}catch(err){toast("No se pudo eliminar en línea.");}}});
  if(d.act==="pdf")return exportPDF(r);
  if(d.act==="copysum"){navigator.clipboard.writeText(summaryText(r)).then(()=>toast("Resumen copiado")).catch(()=>toast("No se pudo copiar"));return;}
  if(d.act==="copycsv"){navigator.clipboard.writeText(csvText(r)).then(()=>toast("Tabla copiada")).catch(()=>toast("No se pudo copiar"));return;}
  if(d.act==="csv"){const name=`Recorrido_${(r.codigo||r.proyecto||"proyecto").replace(/[^\w\-]+/g,"_")}_${r.fecha||""}.csv`;
    S.downloads.save({filename:name,data:csvText(r)}).then(()=>toast("Archivo listo")).catch(err=>{if(err&&err.code!=="declined")toast("No se pudo descargar.");});return;}
});
let typeT=null;
document.addEventListener("input",e=>{
  const t=e.target;const r=cur();if(!r)return;const d=t.dataset;
  if(d.field){const it=itemState(r,d.id);it[d.field]=t.value;}
  else if(d.pfield){const s=pSrc(r,d.pk);if(s)s[d.pfield]=t.value;}
  else if(d.rfield){r[d.rfield]=t.type==="text"?t.value:t.value;}
  else if(d.rcheck){r[d.rcheck]=t.checked;}
  else return;
  r.actualizado=Date.now();S.recs[r.id]=r;S.pending.add(r.id);persistLocal();
  clearTimeout(typeT);typeT=setTimeout(()=>scheduleFlush(200),700);
});
document.addEventListener("change",e=>{
  const t=e.target;const r=cur();
  if(t.dataset.upload){const f=t.files&&t.files[0];t.value="";uploadPhoto(t.dataset.upload,f);return;}
  if(!r)return;
  if(t.dataset.rfield||t.dataset.rcheck){if(S.view==="plazos")render();renderTop();}
  if(t.dataset.pfield==="ronda")touch(r);
});
document.addEventListener("focusout",()=>{if(S._deferRender){S._deferRender=false;setTimeout(()=>{if(!isTyping())render();},50);}});
function isTyping(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&a.type!=="file";}

/* ---------- conexión con la base compartida ---------- */
function applyRemote(snap){
  const before=S.cur&&S.recs[S.cur]?S.recs[S.cur].actualizado:null;
  const seen=new Set();
  snap.docs.forEach(doc=>{const data=doc.data();if(!data)return;seen.add(doc.id);
    const local=S.recs[doc.id];
    if(S.pending.has(doc.id)&&local&&local.actualizado>=(data.actualizado||0))return;
    S.recs[doc.id]=clone(data);S.recs[doc.id].id=doc.id;S.pending.delete(doc.id);});
  if(!snap.metadata.fromCache){Object.keys(S.recs).forEach(id=>{if(!seen.has(id)&&!S.pending.has(id))delete S.recs[id];});}
  persistLocal();
  if(S.cur&&!S.recs[S.cur]){S.cur=null;toast("El recorrido fue eliminado por otra persona.");}
  const after=S.cur&&S.recs[S.cur]?S.recs[S.cur].actualizado:null;
  if(!S.cur||before!==after){if(isTyping())S._deferRender=true;else render();}
}
(async function init(){
  render();
  if(!window.claude||!window.claude.use){setStatus("local");render();return;}
  setStatus("loading");
  const [db,user,assets,downloads]=await Promise.all(["db","user","assets","downloads"].map(n=>window.claude.use(n).catch(()=>null)));
  S.db=db;S.user=user;S.assets=assets;S.downloads=downloads;
  if(user&&user.id){try{S.uid=await user.id();}catch(e){}}
  if(!db){setStatus("local");render();return;}
  try{if(user&&user.can){const w=await user.can("data.write");if(w===false)S.readOnly=true;}}catch(e){}
  let timer=setTimeout(()=>{setStatus("offline");},10000);
  db.collection("recorridos").onSnapshot(snap=>{
    if(!snap.metadata.fromCache){clearTimeout(timer);if(S.status==="loading"||S.status==="offline")setStatus(S.readOnly?"ro":(S.pending.size?"saving":"saved"));}
    applyRemote(snap);
    if(S.pending.size&&!snap.metadata.fromCache)scheduleFlush(300);
  },err=>{clearTimeout(timer);setStatus("offline");});
  render();
})();
